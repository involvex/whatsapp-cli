name: NPM Release

permissions:
  contents: write
  id-token: write

on:
  release:
    types:
      - created
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Formatting
        run: bun run format:check

      - name: Linting
        run: bun run lint

      - name: Type checking
        run: bun run typecheck

      - name: Build
        run: bun run build

      # Verify npm package contents and size
      - name: Check npm package contents
        run: |
          set -euo pipefail
          npm pack --dry-run 2>&1 | tee pack-dry-run.txt
          PACKAGE_SIZE="$(awk '/package size:/ {print $4, $5}' pack-dry-run.txt | tail -1)"
          echo "npm pack dry-run package size: ${PACKAGE_SIZE}"

      # Publish to npm using proven action
      - uses: JS-DevTools/npm-publish@v4
        with:
          token: ${{ secrets.NPM_TOKEN }}
          access: public